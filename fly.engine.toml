# fly.engine.toml — the chimera-engine app (rotation engine + Telegram bot)
#
# Deploy:  fly deploy --config fly.engine.toml
# Secrets live in `fly secrets` (set once, see docs/SETUP.md); config.yaml
# is generated from them at boot by core/gen_config.py.
# Persistent state (customer registry, stats, bot access list) lives on the
# chimera_data volume at /app/data.

app = "chimera-engine"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.engine"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "chimera_data"
  destination = "/app/data"

[[services]]
  internal_port = 8444
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
