# Fly.io deployment config — generated by setup.js
# All secrets are set via: fly secrets set KEY=value

app = "skittles-7f3a"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 5

[build]
dockerfile = "Dockerfile"

[env]
PORT = "3000"
BEACON_PORT = "3001"
NODE_ENV = "production"

[processes]
api = "node server.js"
beacon = "node beacon.js"

[http_service]
internal_port = 3000
processes = ["api"]
force_https = true
auto_stop_machines = false
auto_start_machines = false
min_machines_running = 1

[http_service.concurrency]
type = "requests"
hard_limit = 250
soft_limit = 200

[[http_services]]
internal_port = 3001
processes = ["beacon"]
force_https = true
auto_stop_machines = false
auto_start_machines = false
min_machines_running = 1

[http_services.concurrency]
type = "requests"
hard_limit = 100
soft_limit = 50

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
