# nginx.conf — Reverse proxy for flipper
# nginx listens on :8443 (TLS, self-signed — Vercel terminates public TLS)
# Proxies API/auth routes to Express backend on :3000
# Serves React static bundle for everything else

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /opt/flipper/certs/server.crt;
    ssl_certificate_key /opt/flipper/certs/server.key;

    client_max_body_size 50M;

    # React static bundle
    root /opt/flipper/web/dist;
    index index.html;

    # Backend-served paths (API, auth, pages, assets)
    location ~ ^/(auth|dashboard|admin|subscription|subscriptions|subscription-codes|payment|builder|api|uploads|js|sounds)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / live updates
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Everything else → React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
