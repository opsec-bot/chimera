[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:flipper-backend]
command=node /opt/flipper/dist/server.js
directory=/opt/flipper
environment=NODE_ENV="production",PORT="3000",DATABASE_URL="%(ENV_DATABASE_URL)s",SESSION_SECRET="%(ENV_SESSION_SECRET)s",BASE_URL="%(ENV_BASE_URL)s",OXAPAY_MERCHANT_KEY="%(ENV_OXAPAY_MERCHANT_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/flipper.log
stderr_logfile=/var/log/flipper_err.log
priority=20

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx_err.log
priority=30
